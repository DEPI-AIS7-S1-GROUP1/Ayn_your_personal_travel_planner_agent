services:
  # ============================================================================
  # 1. Backend Service (FastAPI + AI Multi-Agent Engine)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ayn_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Store SQLite database in persistent volume
      - DATABASE_URL=sqlite:////app/data/travel_planner.db
      - PYTHONUNBUFFERED=1
      # Allow requests from container frontend and local dev servers
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    volumes:
      # Persistent storage for SQLite database & uploaded/generated assets
      - ayn_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ayn_network

  # ============================================================================
  # 2. Frontend Service (React 19 + Vite + Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Use relative /api so Nginx proxies requests to backend internally
        - VITE_API_BASE_URL=/api
    container_name: ayn_frontend
    restart: unless-stopped
    ports:
      # Access the web app at http://localhost:3000
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ayn_network

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  ayn_data:
    driver: local

networks:
  ayn_network:
    driver: bridge
